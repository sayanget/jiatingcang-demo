<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}加州家庭仓｜一件代发{% endblock %}</title>
  <style>
    :root {
      --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
      --accent:#38bdf8; --ok:#4ade80; --warn:#fbbf24; --border:#334155;
      --tap:44px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans SC", sans-serif;
      font-size:16px;
      line-height:1.5;
      background:linear-gradient(180deg,#0b1224,#0f172a 40%,#111827);
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
    }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { width:100%; max-width:980px; margin:0 auto; padding:16px 14px 48px; }
    header.site-header {
      display:flex; flex-wrap:wrap; gap:10px;
      justify-content:space-between; align-items:center;
      margin-bottom:18px;
    }
    .brand { font-weight:700; font-size:1.05rem; line-height:1.3; max-width:70%; }
    .nav-toggle {
      display:none; align-items:center; justify-content:center;
      min-width:var(--tap); min-height:var(--tap);
      padding:8px 12px; border-radius:10px; border:1px solid var(--border);
      background:#0b1220; color:var(--text); font-size:1rem; cursor:pointer;
    }
    nav.site-nav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    nav.site-nav a {
      display:inline-flex; align-items:center; justify-content:center;
      min-height:var(--tap); padding:8px 12px; border-radius:10px;
      background:#0b122033; border:1px solid transparent;
      font-size:0.95rem; white-space:nowrap;
    }
    nav.site-nav a:hover { border-color:var(--border); text-decoration:none; background:#0b1220; }
    .card {
      background:rgba(30,41,59,.92); border:1px solid var(--border);
      border-radius:16px; padding:16px; margin-bottom:14px;
      box-shadow:0 10px 30px rgba(0,0,0,.25);
      overflow-wrap:anywhere; word-break:break-word;
    }
    h1 { margin:0 0 8px; font-size:clamp(1.25rem, 4vw, 1.55rem); }
    h2 { margin:0 0 12px; font-size:clamp(1.05rem, 3.5vw, 1.15rem); }
    .muted { color:var(--muted); line-height:1.5; }
    .pill {
      display:inline-block; background:#0ea5e933; color:#7dd3fc;
      border:1px solid #0ea5e966; padding:4px 10px; border-radius:999px;
      font-size:0.85rem; margin:4px 4px 0 0;
    }
    .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); }
    label { display:block; font-size:0.95rem; margin-bottom:6px; color:#cbd5e1; }
    input, textarea, select, button, .btn {
      font-size:16px; /* prevents iOS zoom */
      font-family:inherit;
    }
    input, textarea, select {
      width:100%; max-width:100%;
      min-height:var(--tap);
      padding:12px 14px; border-radius:10px;
      border:1px solid #475569; background:#0b1220; color:var(--text);
    }
    input[type="file"] {
      padding:12px; min-height:var(--tap);
      border:1px dashed #64748b; background:#0b1220;
    }
    textarea { min-height:96px; resize:vertical; }
    .btn, button.btn {
      display:inline-flex; align-items:center; justify-content:center;
      background:var(--accent); color:#082f49; font-weight:700;
      border:0; border-radius:10px;
      min-height:var(--tap); padding:12px 16px; cursor:pointer;
      text-align:center; text-decoration:none;
    }
    .btn.secondary, button.btn.secondary { background:#334155; color:#e2e8f0; }
    .btn.danger, button.btn.danger { background:#7f1d1d; color:#fecaca; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .row > .btn, .row > button { flex:1 1 auto; }
    .table-wrap { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table { width:100%; border-collapse:collapse; font-size:0.95rem; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
    .status { font-weight:700; color:var(--ok); }
    .note { background:#42200655; border:1px solid #a16207; color:#fde68a; padding:10px 12px; border-radius:10px; font-size:0.95rem; }
    .error { background:#7f1d1d55; border:1px solid #f87171; color:#fecaca; padding:10px 12px; border-radius:10px; }
    .okbox { background:#14532d55; border:1px solid #4ade80; color:#bbf7d0; padding:12px; border-radius:12px; }
    code { background:#0b1220; padding:2px 6px; border-radius:6px; word-break:break-all; }
    footer { margin-top:28px; color:var(--muted); font-size:0.85rem; }
    .subcard { background:#0b1220; border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:12px; overflow-wrap:anywhere; }
    .admin-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .admin-actions .btn, .admin-actions button { flex:1 1 140px; }
    .stack-list { display:none; }
    @media (max-width:640px) {
      .wrap { padding:12px 12px 40px; }
      .brand { max-width:calc(100% - 56px); font-size:1rem; }
      .nav-toggle { display:inline-flex; }
      nav.site-nav {
        display:none; width:100%; flex-direction:column; gap:6px;
        padding:8px; border:1px solid var(--border); border-radius:12px; background:#0b1220;
      }
      nav.site-nav.open { display:flex; }
      nav.site-nav a { width:100%; justify-content:flex-start; }
      .grid { grid-template-columns:1fr; }
      .row { flex-direction:column; align-items:stretch; }
      .row > div, .row > .btn, .row > button { width:100%; }
      .btn, button.btn { width:100%; }
      /* Admin/track tables -> stacked cards on mobile when marked */
      table.responsive-cards thead { display:none; }
      table.responsive-cards, table.responsive-cards tbody,
      table.responsive-cards tr, table.responsive-cards td { display:block; width:100%; }
      table.responsive-cards tr {
        background:#0b1220; border:1px solid var(--border);
        border-radius:12px; padding:10px 12px; margin-bottom:10px;
      }
      table.responsive-cards td {
        border:0; padding:6px 0;
      }
      table.responsive-cards td::before {
        content: attr(data-label);
        display:block; font-size:0.8rem; color:var(--muted); margin-bottom:2px;
      }
      .table-wrap { overflow-x:auto; }
      h1 { font-size:1.3rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="brand">加州家庭仓｜一件代发</div>
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav" id="nav-toggle">菜单</button>
      <nav class="site-nav" id="site-nav">
        <a href="/">首页</a>
        <a href="/inbound">入库预报</a>
        <a href="/order">上传面单</a>
        <a href="/track">查件/库存</a>
        <a href="/admin">管理</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
    <footer>Demo · Spark free · 价格详询 · Contact TBD</footer>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('nav-toggle');
      var nav = document.getElementById('site-nav');
      if (!btn || !nav) return;
      btn.addEventListener('click', function () {
        var open = nav.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>
